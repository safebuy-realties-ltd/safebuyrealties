name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      board: ${{ steps.filter.outputs.board }}
      story: ${{ steps.filter.outputs.story }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.*.json'
              - 'components.json'
              - 'eslint.config.*'
              - 'package.json'
              - 'package-lock.json'
              - 'vercel.mjs'
              - 'scripts/vercel-ignore-frontend.mjs'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
            board:
              - 'docs/mvp-board.html'
            # Work a reader would expect to find on the board. Deliberately broad: the board is the
            # index of what this repository is doing, and a change nobody can find from it is a
            # change the next team discovers by accident.
            story:
              - 'src/**'
              - 'backend/**'
              - 'scripts/**'
              - 'prisma/**'
              - '.github/workflows/**'
              - 'docs/**'
              - '!docs/mvp-board.html'

  frontend-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings 0

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Coverage runs here, not in frontend-typecheck, so the floor fails in the job that owns the
      # tests. Thresholds live in vitest.config.ts with the measured baseline written beside them.
      - run: npm run test:cov
      - name: Upload frontend coverage
        if: always() # the report is most useful on the run where the floor failed
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  backend-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:cov
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # working-directory does not apply to `uses:` steps — this path is from the repository root.
          name: coverage-backend
          path: backend/coverage/
          retention-days: 14
          if-no-files-found: error

  # The board is the repository's index of what is done, open and deferred. It went stale twice in
  # the handover week and a person caught it both times, so it is a check now. Two parts: the board
  # must not contradict itself, and a pull request that changes the work must say so on the board.
  board:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-board.mjs verifies the commit named in the board header actually exists.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No npm ci: the check is plain Node against one file, and it should stay that cheap.
      - run: node scripts/check-board.mjs

      - name: Board must record this change
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.story == 'true' &&
          needs.changes.outputs.board != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Escape hatch, on purpose and in the open: some changes genuinely have no board row,
          # and a gate with no exit turns into a gate people route around. Saying why is the price.
          if printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*no-board-update:[[:space:]]*\S'; then
            printf '%s\n' "$PR_BODY" | grep -iE '^[[:space:]]*no-board-update:' | head -1
            exit 0
          fi
          echo "::error file=docs/mvp-board.html::This pull request changes the work but not docs/mvp-board.html."
          echo
          echo "Add or update the row for this story: status, PR number, and the Day column."
          echo "Then run: npm run validate:board"
          echo
          echo "If this change genuinely has no board row, put a line in the PR description:"
          echo "  no-board-update: <reason>"
          exit 1

  # Single required status check for branch protection (see docs/BRANCH_PROTECTION.md).
  ci-gate:
    name: CI (required)
    runs-on: ubuntu-latest
    needs: [changes, frontend-typecheck, frontend-test, backend-check, board]
    if: always()
    steps:
      - name: Changes job must succeed
        if: needs.changes.result != 'success'
        run: |
          echo "changes job result: ${{ needs.changes.result }}"
          exit 1

      - name: Frontend checks (when frontend paths changed)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          if [ "${{ needs.frontend-typecheck.result }}" != "success" ]; then
            echo "frontend-typecheck: ${{ needs.frontend-typecheck.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "frontend-test: ${{ needs.frontend-test.result }}"
            exit 1
          fi

      - name: Backend checks (when backend paths changed)
        if: needs.changes.outputs.backend == 'true'
        run: |
          if [ "${{ needs.backend-check.result }}" != "success" ]; then
            echo "backend-check failed or was cancelled: ${{ needs.backend-check.result }}"
            exit 1
          fi

      - name: Board check
        if: needs.board.result != 'success'
        run: |
          echo "board: ${{ needs.board.result }}"
          exit 1

      - name: CI gate passed
        run: echo "All required checks passed."
