name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      lint: ${{ steps.filter.outputs.lint }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.*.json'
              - 'components.json'
              - 'eslint.config.*'
              - 'package.json'
              - 'package-lock.json'
              - 'vercel.mjs'
              - 'scripts/vercel-ignore-frontend.mjs'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'

            # Both halves, plus the files that decide what the rules are. Wider than either of the
            # two above on purpose: eslint.config.js and .prettierrc govern src/ and backend/ alike,
            # so a change to one of them has to lint both or it proves nothing.
            lint:
              - 'src/**'
              - 'backend/**'
              - 'eslint.config.*'
              - '.prettierrc'
              - '.prettierignore'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

            # The board's own filters used to live here and no longer do. They needed to say "work,
            # but not the three documents that record it", and a negated pattern does not subtract
            # on any released version of this action: the exclusion quantifier is on its main branch
            # and unreleased, so `- '!docs/mvp-board.html'` matched every other file rather than
            # removing that one. Harmless while one document was gated, wrong once three are, so the
            # `board` job works the list out with one git call instead.

            # Anything that could change what a journey does or whether it still passes. Narrower
            # than the board job's list because these two jobs cost roughly ten runner-minutes
            # between them and a documentation change should not buy them.
            e2e:
              - 'src/**'
              - 'backend/**'
              - 'scripts/e2e-ci.mjs'
              - 'scripts/journey-e2e-all-roles.mjs'
              - 'scripts/listing-lifecycle-e2e.mjs'
              - 'scripts/guest-checkout-e2e.mjs'
              - 'scripts/dd-checklist-e2e.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - '.github/workflows/ci.yml'
              - '.github/actions/ephemeral-api/**'

  frontend-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  # Lint, for the whole repository. This was one step inside frontend-typecheck reading `src`, which
  # is the frontend and only the frontend, so nothing anywhere ran eslint over `backend/src`. By
  # 2026-08-07 that had accumulated 226 errors and a warning nobody had seen. It is a job of its own
  # now because it belongs to neither half: eslint, its plugins and prettier are root dependencies
  # and eslint.config.js is a root file, so this runs from the repository root and names both.
  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # Root install only, and no backend npm ci. Every rule that reaches the backend is syntactic,
      # so none of this needs backend/node_modules or a TypeScript program to answer.
      - run: npm ci
      - run: npx eslint src backend/src --max-warnings 0

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-coverage.mjs diffs this branch against the base commit, which is not in a depth-1
          # clone. Without this it cannot tell which lines the pull request changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Coverage runs here, not in frontend-typecheck, so the floor fails in the job that owns the
      # tests. Thresholds live in vitest.config.ts with the measured baseline written beside them.
      - run: npm run test:cov

      # The floor above stops coverage falling. This is the bar on what the pull request added, which
      # is what stops the gap accruing. It runs inside this job rather than a job of its own because
      # the lcov it reads was written thirty seconds ago and would otherwise need artifact plumbing,
      # and because this job already feeds ci-gate, so failing here fails the required check.
      - name: Diff coverage on changed frontend files
        if: github.event_name == 'pull_request'
        env:
          DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/diff-coverage.mjs --scope frontend

      - name: Upload frontend coverage
        if: always() # the report is most useful on the run where the floor failed
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 14
          if-no-files-found: error

  backend-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # same reason as frontend-test: the diff needs the base commit
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:cov

      # ../ because this job runs with working-directory: backend. The script itself does not care
      # where it is called from, it anchors on its own location.
      - name: Diff coverage on changed backend files
        if: github.event_name == 'pull_request'
        env:
          DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node ../scripts/diff-coverage.mjs --scope backend

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # working-directory does not apply to `uses:` steps — this path is from the repository root.
          name: coverage-backend
          path: backend/coverage/
          retention-days: 14
          if-no-files-found: error

  # E7-S3. The five journeys of the acceptance criteria, run against a Postgres that exists for the
  # length of the job and is thrown away with the runner. Split in two because criterion 6 asks for
  # a pull request path under ten minutes and one job doing all of it lands at roughly eight with no
  # margin: the browser half needs the frontend dependencies and a Chromium, and the API half needs
  # neither. They run in parallel, so the path is the slower of the two rather than the sum.
  #
  # Both carry `timeout-minutes: 10` on purpose. That is criterion 6 written down where it fails
  # rather than in a document where it rots.
  e2e-api:
    name: E2E journeys (API)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sbr_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ephemeral-api

      # No npm ci at the repository root: these three scripts are plain Node using fetch, with no
      # imports outside node: builtins. That is worth about a minute of every run.
      - name: Buyer purchase, seller to live with staff verification, guest checkout
        env:
          SBR_API_BASE: http://127.0.0.1:3001/api/v1
          # Strict, because the database was seeded ninety seconds ago. A journey reporting
          # "no LIVE listing available" here is a regression, not a quiet afternoon.
          SBR_E2E_STRICT: "1"
        run: node scripts/e2e-ci.mjs --kind api

      - name: Upload journey logs
        if: always() # criterion 5: the run that failed is the run whose logs are wanted
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api
          path: artifacts/e2e/
          retention-days: 14
          if-no-files-found: warn

  e2e-browser:
    name: E2E journeys (browser)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sbr_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      # The API first, so a broken API fails this job in three minutes rather than after paying for
      # a Chromium download. The composite action leaves it running in the background.
      - uses: ./.github/actions/ephemeral-api
        with:
          frontend-url: http://127.0.0.1:8080

      - name: Node for the frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22" # matches frontend-test; the API above is built on 20 and already running
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start the app
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e
          # `vite dev` rather than `vite preview`. The proxy that puts the API on the same origin as
          # the app is declared under `server` in vite.config.ts, which preview does not read, and
          # src/lib/api.ts deliberately ignores an absolute VITE_API_URL because session cookies
          # have to be same-origin. So dev is not a shortcut here, it is the only mode that serves
          # a working application.
          setsid npx vite dev --port 8080 --strictPort > artifacts/e2e/app.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "App ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::App did not start within 90s"
          cat artifacts/e2e/app.log || true
          exit 1

      - name: Standalone due diligence
        env:
          SBR_APP_URL: http://127.0.0.1:8080
          SBR_API_BASE: http://127.0.0.1:3001/api/v1
          SBR_E2E_STRICT: "1"
        run: node scripts/e2e-ci.mjs --kind browser

      - name: Upload journey logs and screenshots
        if: always() # criterion 5. This job is the one that produces the screenshots.
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser
          path: artifacts/e2e/
          retention-days: 14
          if-no-files-found: warn

  # The board is the repository's index of what is done, open and deferred. It went stale twice in
  # the handover week and a person caught it both times, so it is a check now. Three parts: the
  # board must not contradict itself, a pull request that changes the work must say so on the board,
  # and it must say so in the two documents that record what is left. Rule 8, docs/HANDOVER_WEEK.md.
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-board.mjs verifies the commit named in the board header actually exists, and the
          # step below diffs against the pull request's base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No npm ci: the check is plain Node against one file, and it should stay that cheap.
      - run: node scripts/check-board.mjs

      # Work out what this pull request touched, here rather than in the `changes` job, because the
      # question these gates ask is "work, but not the documents that record it" and paths-filter
      # cannot subtract on any released version. Deliberately broad on what counts as work: the
      # board is the index of what this repository is doing, and a change nobody can find from it is
      # a change the next team discovers by accident.
      - name: What this pull request touched
        id: touched
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          RECORD='docs/mvp-board.html docs/MVP_OUTSTANDING_BACKLOG.md docs/BUILD_CHECKLIST.md'
          FILES=$(git diff --name-only "$BASE_SHA...HEAD")
          has() { printf '%s\n' "$FILES" | grep -qxF "$1"; }
          WORK=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case " $RECORD " in *" $f "*) continue ;; esac
            case "$f" in
              src/*|backend/*|scripts/*|prisma/*|.github/workflows/*|.github/actions/*|docs/*)
                WORK=true; break ;;
            esac
          done <<< "$FILES"
          {
            echo "work=$WORK"
            has docs/mvp-board.html && echo "board=true" || echo "board=false"
            has docs/MVP_OUTSTANDING_BACKLOG.md && echo "backlog=true" || echo "backlog=false"
            has docs/BUILD_CHECKLIST.md && echo "checklist=true" || echo "checklist=false"
          } >> "$GITHUB_OUTPUT"

      - name: Board must record this change
        if: >-
          github.event_name == 'pull_request' &&
          steps.touched.outputs.work == 'true' &&
          steps.touched.outputs.board != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Escape hatch, on purpose and in the open: some changes genuinely have no board row,
          # and a gate with no exit turns into a gate people route around. Saying why is the price.
          if printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*no-board-update:[[:space:]]*\S'; then
            printf '%s\n' "$PR_BODY" | grep -iE '^[[:space:]]*no-board-update:' | head -1
            exit 0
          fi
          echo "::error file=docs/mvp-board.html::This pull request changes the work but not docs/mvp-board.html."
          echo
          echo "Add or update the row for this story: status, PR number, and the Day column."
          echo "Then run: npm run validate:board"
          echo
          echo "If this change genuinely has no board row, put a line in the PR description:"
          echo "  no-board-update: <reason>"
          exit 1

      # The board says what happened. These two say what is left, and the backlog is what the next
      # session picks its work from, so a row still reading "startable" after the story merged hands
      # somebody work that is already built. They were kept current by habit for five waves; habit
      # is what rule 8 exists to replace.
      - name: The remaining-work documents must record this change
        if: >-
          github.event_name == 'pull_request' &&
          steps.touched.outputs.work == 'true' &&
          (steps.touched.outputs.backlog != 'true' || steps.touched.outputs.checklist != 'true')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BACKLOG: ${{ steps.touched.outputs.backlog }}
          CHECKLIST: ${{ steps.touched.outputs.checklist }}
        run: |
          # Same escape hatch and the same reasoning as the board's: a waiver the reviewer reads is
          # a decision, a waiver nobody sees is a hole.
          if printf '%s' "$PR_BODY" | grep -qiE '^[[:space:]]*no-remaining-update:[[:space:]]*\S'; then
            printf '%s\n' "$PR_BODY" | grep -iE '^[[:space:]]*no-remaining-update:' | head -1
            exit 0
          fi
          if [ "$BACKLOG" != "true" ]; then
            echo "::error file=docs/MVP_OUTSTANDING_BACKLOG.md::This pull request changes the work but not docs/MVP_OUTSTANDING_BACKLOG.md."
            echo
            echo "Set the epic-table row's status to the PR number and the flag state, put Merged on"
            echo "the story entry's Size line, and add a Delivered section saying what you did not"
            echo "deliver as well as what you did. If a dependency moved, date a reconciliation note"
            echo "under section 3.1 rather than rewriting the last one."
            echo
          fi
          if [ "$CHECKLIST" != "true" ]; then
            echo "::error file=docs/BUILD_CHECKLIST.md::This pull request changes the work but not docs/BUILD_CHECKLIST.md."
            echo
            echo "Update Last Session Notes at the top: date, last completed in enough detail that"
            echo "the next session need not read the diff, what is next, and blockers. If you closed"
            echo "one of the audit corrections, say so in its row and name the PR."
            echo
          fi
          echo "If this change genuinely has no row and no session to record, put a line in the PR"
          echo "description:"
          echo "  no-remaining-update: <reason>"
          exit 1

  # Rule 10 in docs/HANDOVER_WEEK.md: nothing in this repository names the assistant product that
  # helped write it. Deliberately unfiltered by path. Every other job here is filtered because it
  # costs runner-minutes, but this one reads tracked text through one git call and finishes in
  # seconds, and a writing rule that applies to some diffs and not others is a rule with a gap in
  # the middle of it.
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No npm ci, for the same reason the board check skips it: plain Node and one git call.
      - run: node scripts/check-prose.mjs

  # Single required status check for branch protection (see docs/BRANCH_PROTECTION.md).
  ci-gate:
    name: CI (required)
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        frontend-typecheck,
        frontend-test,
        lint,
        backend-check,
        e2e-api,
        e2e-browser,
        board,
        prose,
      ]
    if: always()
    steps:
      - name: Changes job must succeed
        if: needs.changes.result != 'success'
        run: |
          echo "changes job result: ${{ needs.changes.result }}"
          exit 1

      - name: Frontend checks (when frontend paths changed)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          if [ "${{ needs.frontend-typecheck.result }}" != "success" ]; then
            echo "frontend-typecheck: ${{ needs.frontend-typecheck.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "frontend-test: ${{ needs.frontend-test.result }}"
            exit 1
          fi

      - name: Lint (when anything it reads changed)
        if: needs.changes.outputs.lint == 'true'
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "lint: ${{ needs.lint.result }}"
            exit 1
          fi

      - name: Backend checks (when backend paths changed)
        if: needs.changes.outputs.backend == 'true'
        run: |
          if [ "${{ needs.backend-check.result }}" != "success" ]; then
            echo "backend-check failed or was cancelled: ${{ needs.backend-check.result }}"
            exit 1
          fi

      - name: End-to-end journeys (when they could be affected)
        if: needs.changes.outputs.e2e == 'true'
        run: |
          if [ "${{ needs.e2e-api.result }}" != "success" ]; then
            echo "e2e-api: ${{ needs.e2e-api.result }}"
            exit 1
          fi
          if [ "${{ needs.e2e-browser.result }}" != "success" ]; then
            echo "e2e-browser: ${{ needs.e2e-browser.result }}"
            exit 1
          fi

      - name: Board check
        if: needs.board.result != 'success'
        run: |
          echo "board: ${{ needs.board.result }}"
          exit 1

      - name: Prose check
        if: needs.prose.result != 'success'
        run: |
          echo "prose: ${{ needs.prose.result }}"
          exit 1

      - name: CI gate passed
        run: echo "All required checks passed."
