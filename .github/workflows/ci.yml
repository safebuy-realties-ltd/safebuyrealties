name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.*.json'
              - 'components.json'
              - 'eslint.config.*'
              - 'package.json'
              - 'package-lock.json'
              - 'vercel.mjs'
              - 'scripts/vercel-ignore-frontend.mjs'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'

  frontend-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings 0

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test

  backend-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Single required status check for branch protection (see docs/BRANCH_PROTECTION.md).
  ci-gate:
    name: CI (required)
    runs-on: ubuntu-latest
    needs: [changes, frontend-typecheck, frontend-test, backend-check]
    if: always()
    steps:
      - name: Changes job must succeed
        if: needs.changes.result != 'success'
        run: |
          echo "changes job result: ${{ needs.changes.result }}"
          exit 1

      - name: Frontend checks (when frontend paths changed)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          if [ "${{ needs.frontend-typecheck.result }}" != "success" ]; then
            echo "frontend-typecheck: ${{ needs.frontend-typecheck.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "frontend-test: ${{ needs.frontend-test.result }}"
            exit 1
          fi

      - name: Backend checks (when backend paths changed)
        if: needs.changes.outputs.backend == 'true'
        run: |
          if [ "${{ needs.backend-check.result }}" != "success" ]; then
            echo "backend-check failed or was cancelled: ${{ needs.backend-check.result }}"
            exit 1
          fi

      - name: CI gate passed
        run: echo "All required checks passed."
