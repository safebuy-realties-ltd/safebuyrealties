services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safebuyrealties
    # Host 5432 matches default DATABASE_URL in .env.example. If port is busy, change to "5433:5432" and set DATABASE_URL port to 5433.
    ports:
      - "5432:5432"
    volumes:
      - sbr_pg_data:/var/lib/postgresql/data

volumes:
  sbr_pg_data:
